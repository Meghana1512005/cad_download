name: 2 - Download GLB Models

on:
  push:
    paths:
      - 'data/models.json'
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Queue start index'
        required: false
        default: '0'
      batch_size:
        description: 'Models per run'
        required: false
        default: '150'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Download GLB files
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          BATCH_START: ${{ github.event.inputs.batch_start || '0' }}
          BATCH_SIZE:  ${{ github.event.inputs.batch_size  || '150' }}
        run: python scripts/download_glb.py

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          find downloaded_models -type f -name "*.glb" -o -name "*.zip" 2>/dev/null | head -20 || echo "None"

      - name: Collect GLBs into flat folder
        run: |
          mkdir -p release_files
          find downloaded_models -type f \( -name "*.glb" -o -name "*.zip" \) -exec cp {} release_files/ \; 2>/dev/null || true
          echo "Files collected: $(ls release_files/ 2>/dev/null | wc -l)"
          ls release_files/ 2>/dev/null | head -30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-latest
          name: Downloaded CAD Models
          files: release_files/*
          fail_on_unmatched_files: false
          make_latest: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit status
        run: |
          git config user.name  "CAD Bot"
          git config user.email "bot@cad-downloader"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git add data/models.json
          git diff --staged --quiet || git commit -m "Download batch: update status"
          git push
