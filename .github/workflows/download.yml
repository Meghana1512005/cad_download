name: 2 - Download GLB Models

on:
  push:
    paths:
      - 'data/models.json'
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Queue start index'
        required: false
        default: '0'
      batch_size:
        description: 'Models per run'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Debug queue
        run: python3 scripts/debug_queue.py

      - name: Download GLB files
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          BATCH_START: ${{ github.event.inputs.batch_start || '0' }}
          BATCH_SIZE:  ${{ github.event.inputs.batch_size  || '100' }}
        run: python scripts/download_glb.py

      - name: Show debug log
        run: cat data/download_debug.txt || echo "No debug log found"

      - name: Debug after download
        run: |
          echo "Downloaded files count:"
          find downloaded_models -type f \( -name "*.glb" -o -name "*.zip" \) 2>/dev/null | wc -l

      - name: Collect GLBs into flat folder
        run: |
          mkdir -p release_files
          find downloaded_models -type f \( -name "*.glb" -o -name "*.zip" \) -exec cp {} release_files/ \; 2>/dev/null || true
          echo "Files to release: $(ls release_files/ 2>/dev/null | wc -l)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-latest
          name: Downloaded CAD Models
          files: release_files/*
          fail_on_unmatched_files: false
          make_latest: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit status
        run: |
          git config user.name  "CAD Bot"
          git config user.email "bot@cad-downloader"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git add data/models.json data/download_debug.txt
          git diff --staged --quiet && echo "NO CHANGES DETECTED" || git commit -m "Download batch: update status"
          git pull --rebase origin main && git push || (git pull --rebase origin main && git push)
