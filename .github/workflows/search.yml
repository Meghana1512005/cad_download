name: 1 - Search All CAD Sources

on:
  push:
    paths:
      - 'data/models.json'
      - '.github/workflows/search.yml'
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Start index'
        required: false
        default: '0'
      batch_size:
        description: 'Models per run'
        required: false
        default: '100'
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Search all CAD sources
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          BATCH_START: ${{ github.event.inputs.batch_start || '0' }}
          BATCH_SIZE:  ${{ github.event.inputs.batch_size  || '100' }}
        run: python scripts/search_all_sources.py

      - name: Commit results
        run: |
          git config user.name  "CAD Bot"
          git config user.email "bot@cad-downloader"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git add data/models.json
          git diff --staged --quiet || git commit -m "Search batch ${{ github.event.inputs.batch_start || '0' }}: update model status"
          git push
