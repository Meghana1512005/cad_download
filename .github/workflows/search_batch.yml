name: 3 - Search Batch (configurable)

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Start index (0-based)'
        required: false
        default: '3000'
      batch_size:
        description: 'Models per run'
        required: false
        default: '909'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Search models
        env:
          SKETCHFAB_TOKEN:   ${{ secrets.SKETCHFAB_TOKEN }}
          GRABCAD_SESSION:   ${{ secrets.GRABCAD_SESSION }}
          GRABCAD_XSRF:      ${{ secrets.GRABCAD_XSRF }}
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}
          BATCH_START: ${{ github.event.inputs.batch_start || '1900' }}
          BATCH_SIZE:  ${{ github.event.inputs.batch_size  || '1000' }}
        run: python scripts/search_all_sources.py

      - name: Commit results
        run: |
          git config user.name  "CAD Bot"
          git config user.email "bot@cad-downloader"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git add data/models.json
          git diff --staged --quiet || git commit -m "Search batch ${{ github.event.inputs.batch_start || '1900' }}: update status"
          git pull --rebase origin main && git push || (git pull --rebase origin main && git push)
