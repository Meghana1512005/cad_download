name: Test GrabCAD Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests playwright
      - run: playwright install chromium --with-deps
      - name: Test GrabCAD Playwright login
        env:
          GRABCAD_USER:  ${{ secrets.GRABCAD_USER }}
          GRABCAD_PASS:  ${{ secrets.GRABCAD_PASS }}
          GRABCAD_EMAIL: ${{ secrets.GRABCAD_EMAIL }}
        run: python scripts/grabcad_playwright.py
