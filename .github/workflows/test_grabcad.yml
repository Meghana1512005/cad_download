name: Test GrabCAD Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests playwright
      - run: playwright install chromium --with-deps
      - name: Test GrabCAD Playwright login
        env:
          GRABCAD_EMAIL: ${{ secrets.GRABCAD_EMAIL }}
          GRABCAD_PASS:  ${{ secrets.GRABCAD_PASS }}
        run: python scripts/grabcad_playwright.py
---
name: Debug GrabCAD Login Page

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install playwright
      - run: playwright install chromium --with-deps
      - name: Debug login page
        env:
          GRABCAD_EMAIL: ${{ secrets.GRABCAD_EMAIL }}
          GRABCAD_PASS:  ${{ secrets.GRABCAD_PASS }}
        run: python scripts/grabcad_debug.py
      - uses: actions/upload-artifact@v4
        with:
          name: grabcad-screenshot
          path: /tmp/grabcad_login.png
