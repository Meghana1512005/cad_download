name: Test GrabCAD Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test GrabCAD with browser cookies
        env:
          GRABCAD_SESSION: ${{ secrets.GRABCAD_SESSION }}
          GRABCAD_XSRF:    ${{ secrets.GRABCAD_XSRF }}
        run: python scripts/grabcad_stealth.py
